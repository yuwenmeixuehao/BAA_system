[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-agent-backend"
version = "0.1.0"
description = "经营归因分析系统后端"
requires-python = ">=3.11"
dependencies = [
  "aiomysql>=0.2,<1",
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pyarrow>=17,<24",
  "pyjwt[crypto]>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.6,<3",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "sqlglot>=26,<29",
  "uvicorn[standard]>=0.30,<1",
  "xlrd>=2,<3",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
